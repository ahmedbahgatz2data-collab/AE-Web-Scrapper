name: Build exe and auto-release

# يعمل تلقائياً عند أي تعديل على الكود أو عند التشغيل اليدوي من تبويب Actions
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "AE_WEB_SCRAPPER.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract APP_VERSION and check if release exists
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = python -c "import re; s=open('AE_WEB_SCRAPPER.py', encoding='utf-8').read(); m=re.search(r'APP_VERSION\s*=\s*[\x22\x27]([^\x22\x27]+)[\x22\x27]', s); print(m.group(1).lstrip('vV') if m else '')"
          if (-not $version) {
            Write-Error "APP_VERSION not found in AE_WEB_SCRAPPER.py"
            exit 1
          }
          $tag = "v$version"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "exists=$exists" >> $env:GITHUB_OUTPUT
          Write-Host "Detected version: $tag | Already released: $exists"

      - name: Install dependencies
        if: steps.ver.outputs.exists == 'False' || github.event_name == 'workflow_dispatch'
        run: pip install selenium pyinstaller

      - name: Build exe
        if: steps.ver.outputs.exists == 'False' || github.event_name == 'workflow_dispatch'
        run: pyinstaller --onefile --windowed --clean --collect-all selenium --name AEWEBSCRAPPER AE_WEB_SCRAPPER.py

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.exists == 'False' || github.event_name == 'workflow_dispatch'
        with:
          name: AEWEBSCRAPPER
          path: dist/AEWEBSCRAPPER.exe

      - name: Publish GitHub Release automatically
        if: steps.ver.outputs.exists == 'False'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          files: dist/AEWEBSCRAPPER.exe
          generate_release_notes: true
